<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone Watchtower — Live Detection</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="sysname">Drone Watchtower</div>
    <div class="tabs">
      <span class="tab active" id="tab-monitor">Live Monitoring</span>
      <span class="tab" data-coming>Statistics</span>
      <span class="tab" id="tab-history">Events</span>
    </div>
    <div class="controls">
      <div id="dongles" class="dongles" aria-label="Radios">        <span class="dongle off" id="dongle-pro" title="HackRF Pro · DroneID"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6v2h2v5H3V3h2V1zm-1 8h8v2H4V9zm1 3h6v2H5v-2z"/></svg>DroneID</span>
        <span class="dongle off" id="dongle-c5" title="ESP32-C5 · Remote ID"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6v2h2v5H3V3h2V1zm-1 8h8v2H4V9zm1 3h6v2H5v-2z"/></svg>RemoteID</span>
        <span class="dongle off" id="dongle-one" title="HackRF One · ELRS / TBS"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6v2h2v5H3V3h2V1zm-1 8h8v2H4V9zm1 3h6v2H5v-2z"/></svg>ELRS</span>
        <span class="dongle off" id="dongle-rtl" title="RTL-SDR · ADS-B 1090"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6v2h2v5H3V3h2V1zm-1 8h8v2H4V9zm1 3h6v2H5v-2z"/></svg>ADS-B</span>
        <span class="dongle off" id="dongle-gps" title="u-blox 7 · GPS"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2C5.3 1.2 3.1 3.4 3.1 6.1 3.1 9.4 8 14.8 8 14.8s4.9-5.4 4.9-8.7C12.9 3.4 10.7 1.2 8 1.2zm0 6.5a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4z"/></svg><span class="dongle-count">GPS</span></span>
        <span class="dongle off" id="dongle-net" title="Internet"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5c1 0 2 .9 2.6 2.2.4.8.6 1.7.7 2.6H4.7c.1-.9.3-1.8.7-2.6C6 3.4 7 2.5 8 2.5zM4.5 8.2h7c-.1 1-.4 2-.9 2.8-.7 1.2-1.6 1.9-2.6 1.9s-1.9-.7-2.6-1.9c-.5-.8-.8-1.8-.9-2.8z"/></svg>Internet</span>
      </div>
      <button id="btn-video" class="ghost">Hide video</button>
      <button id="btn-scan" class="scanning">Stop scan</button>
    </div>
  </header>

  <div id="banner" class="hidden">Drone detected — DroneID telemetry active</div>

  <main>
    <aside id="sidebar">
      <section class="dash dash-drone">
        <div class="side-head">
          <span id="side-head-label">Drone detection</span>
          <span id="session-count" class="dim">0</span>
        </div>
        <div id="alert-list"></div>
      </section>
      <section class="dash dash-adsb">
        <div class="side-head">
          <span>ADS-B 1090</span>
          <span id="adsb-count" class="dim">0</span>
        </div>
        <div id="adsb-list"></div>
      </section>
    </aside>

    <section id="mapwrap">
      <div id="map"></div>
      <div id="hist-controls" class="hidden">
        <select id="hist-source" title="Protocol filter">
          <option value="">All protocols</option>
          <option value="remoteid">RemoteID</option>
          <option value="droneid">DroneID</option>
          <option value="elrs">ELRS</option>
          <option value="mavlink">MAVLink</option>
          <option value="vtx">VTX</option>
        </select>
        <input type="date" id="hist-from" title="From (UTC)">
        <input type="date" id="hist-to" title="To (UTC)">
        <button id="hist-map" class="ghost">Show map</button>
        <button id="hist-export" class="ghost">Export CSV</button>
        <button id="hist-more" class="ghost">Load more</button>
      </div>
      <div id="history-table" class="hidden"></div>
      <div id="vtx-panel" class="hidden">
        <div class="vtx-head">
          <span id="vtx-panel-label">FPV video</span>
        </div>
        <div id="vtx-status" class="vtx-status">waiting for video frames…</div>
        <img id="vtx-video" alt="FPV video feed" class="hidden">
        <div class="vtx-resize" title="Resize"></div>
      </div>
    </section>

    <aside id="infopanel">
      <div id="info-empty">Nothing selected — live detections appear here</div>
      <div id="info-body" class="hidden">
        <div class="info-title">
          <span id="i-model">Drone</span>
          <span id="i-marker" class="pill">DroneID</span>
        </div>
        <div id="info-kv"></div>
        <h3>Recent packets</h3>
        <table id="pkt-table">
          <thead><tr><th>Time</th><th>Ch</th><th>Type</th><th>dBFS</th></tr></thead>
          <tbody id="pkt-body"></tbody>
        </table>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
